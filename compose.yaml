services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nouri
      POSTGRES_PASSWORD: nouri
      POSTGRES_DB: nouri
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nouri -d nouri"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  postgres-data:
