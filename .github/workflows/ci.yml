name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Build, lint, typecheck, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nouri
          POSTGRES_PASSWORD: nouri
          POSTGRES_DB: nouri_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nouri -d nouri_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck API and frontend
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Build frontend
        run: pnpm build:web

      - name: Integration tests
        run: pnpm test:integration
        env:
          DATABASE_URL: postgres://nouri:nouri@127.0.0.1:5432/nouri_test
